<div
  class="flex h-full flex-col justify-between rounded-xl p-4"
  [class.border]="!featured()"
  [class.border-theme-border]="!featured()"
  [class.bg-white]="!featured()"
  [class.bg-umdzidzisi-800]="featured()"
>
  <div class="flex items-start justify-between gap-2">
    <span
      class="text-xs font-medium tracking-wide uppercase"
      [class.text-theme-text-secondary]="!featured()"
      [class.text-umdzidzisi-200]="featured()"
    >
      {{ metric().label }}
    </span>
    @if (metric().delta.pct !== 0) {
      <span
        class="rounded-full px-2 py-0.5 text-xs font-semibold tabular-nums"
        [class.text-success]="tone() === 'up'"
        [class.text-error]="tone() === 'down'"
      >
        {{ tone() === 'up' ? '▲' : '▼' }} {{ absPct() | number: '1.0-1' }}%
      </span>
    }
  </div>
  <div class="mt-2 flex items-end justify-between gap-2">
    <span
      class="text-2xl font-bold tabular-nums"
      [class.text-theme-text]="!featured()"
      [class.text-white]="featured()"
    >
      {{ metric().value | number }}{{ metric().suffix }}
    </span>
    <org-sparkline
      [series]="metric().series"
      [tone]="tone()"
      [width]="72"
      [height]="24"
    />
  </div>
</div>
