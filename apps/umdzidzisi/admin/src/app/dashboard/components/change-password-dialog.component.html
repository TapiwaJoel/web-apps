<div class="cpw-backdrop" (click)="onCancel()"></div>

<div
  class="cpw-dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cpw-title"
  (keydown.escape)="onCancel()"
>
  @if (submitted()) {
    <div class="cpw-success">
      <span class="cpw-success-icon" aria-hidden="true">
        <i class="fi fi-rr-check"></i>
      </span>
      <p class="cpw-success-title">Password updated</p>
      <p class="cpw-success-sub">Your password has been changed.</p>
    </div>
  } @else {
    <header class="cpw-header">
      <h2 id="cpw-title" class="cpw-title">Change password</h2>
      <button
        type="button"
        class="cpw-close"
        aria-label="Close"
        (click)="onCancel()"
      >
        <i class="fi fi-rr-cross-small" aria-hidden="true"></i>
      </button>
    </header>

    <form class="cpw-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Current password -->
      <label class="cpw-field">
        <span class="cpw-label">Current password</span>
        <span class="cpw-input-wrap">
          <input
            [type]="show().current ? 'text' : 'password'"
            formControlName="currentPassword"
            autocomplete="current-password"
            class="cpw-input"
          />
          <button
            type="button"
            class="cpw-eye"
            [attr.aria-label]="show().current ? 'Hide password' : 'Show password'"
            (click)="toggleShow('current')"
          >
            <i
              [class]="show().current ? 'fi fi-rr-eye-crossed' : 'fi fi-rr-eye'"
              aria-hidden="true"
            ></i>
          </button>
        </span>
        @if (
          form.get('currentPassword')?.touched &&
          form.get('currentPassword')?.hasError('required')
        ) {
          <span class="cpw-error">Enter your current password.</span>
        }
      </label>

      <!-- New password -->
      <label class="cpw-field">
        <span class="cpw-label">New password</span>
        <span class="cpw-input-wrap">
          <input
            [type]="show().next ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            class="cpw-input"
          />
          <button
            type="button"
            class="cpw-eye"
            [attr.aria-label]="show().next ? 'Hide password' : 'Show password'"
            (click)="toggleShow('next')"
          >
            <i
              [class]="show().next ? 'fi fi-rr-eye-crossed' : 'fi fi-rr-eye'"
              aria-hidden="true"
            ></i>
          </button>
        </span>
        @if (form.get('newPassword')?.touched) {
          @if (form.get('newPassword')?.hasError('required')) {
            <span class="cpw-error">Enter a new password.</span>
          } @else if (form.get('newPassword')?.hasError('minlength')) {
            <span class="cpw-error">Use at least 8 characters.</span>
          }
        }
      </label>

      <!-- Confirm password -->
      <label class="cpw-field">
        <span class="cpw-label">Confirm new password</span>
        <span class="cpw-input-wrap">
          <input
            [type]="show().confirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            class="cpw-input"
          />
          <button
            type="button"
            class="cpw-eye"
            [attr.aria-label]="show().confirm ? 'Hide password' : 'Show password'"
            (click)="toggleShow('confirm')"
          >
            <i
              [class]="show().confirm ? 'fi fi-rr-eye-crossed' : 'fi fi-rr-eye'"
              aria-hidden="true"
            ></i>
          </button>
        </span>
        @if (
          form.get('confirmPassword')?.touched &&
          form.get('confirmPassword')?.hasError('required')
        ) {
          <span class="cpw-error">Confirm your new password.</span>
        } @else if (showMismatch) {
          <span class="cpw-error">Passwords don't match.</span>
        }
      </label>

      <footer class="cpw-actions">
        <button type="button" class="cpw-btn cpw-btn-ghost" (click)="onCancel()">
          Cancel
        </button>
        <button
          type="submit"
          class="cpw-btn cpw-btn-primary"
          [disabled]="form.invalid"
        >
          Update password
        </button>
      </footer>
    </form>
  }
</div>
