<div class="border-theme-border rounded-xl border bg-white p-5">
  <h3 class="text-theme-text text-sm font-semibold">Examination boards</h3>
  <div class="mt-3 overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr
          class="text-theme-text-secondary text-left text-xs tracking-wide uppercase"
        >
          <th class="pb-2 font-medium">Board</th>
          <th class="pb-2 font-medium">Level</th>
          <th class="pb-2 text-right font-medium">Candidates</th>
          <th class="pb-2 text-right font-medium">Pass rate</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.board) {
          <tr class="border-theme-border border-t">
            <td class="text-theme-text py-2.5 font-medium">{{ row.board }}</td>
            <td class="text-theme-text-secondary py-2.5">{{ row.level }}</td>
            <td class="text-theme-text py-2.5 text-right tabular-nums">
              {{ row.candidates | number }}
            </td>
            <td class="py-2.5 text-right tabular-nums">
              {{ row.passRate }}%
              <span
                class="ml-1"
                [class.text-success]="row.delta.pct >= 0"
                [class.text-error]="row.delta.pct < 0"
              >
                {{ row.delta.pct >= 0 ? '▲' : '▼' }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
