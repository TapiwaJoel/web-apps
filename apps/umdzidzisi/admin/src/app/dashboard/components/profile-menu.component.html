<button
  type="button"
  class="profile-trigger focus:ring-theme-primary flex items-center gap-2 rounded-full focus:ring-2 focus:outline-none"
  aria-label="Account menu"
  [attr.aria-expanded]="isOpen()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="toggle()"
>
  <span class="profile-avatar" aria-hidden="true">{{ initials() }}</span>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="[
    {
      originX: 'end',
      originY: 'bottom',
      overlayX: 'end',
      overlayY: 'top',
      offsetY: 8,
    },
  ]"
  (backdropClick)="close()"
  (overlayOutsideClick)="close()"
  (detach)="close()"
>
  <div
    class="profile-panel"
    role="menu"
    aria-label="Account menu"
    tabindex="-1"
    (keydown.escape)="close()"
  >
    <div class="profile-head">
      <span class="profile-head-avatar" aria-hidden="true">{{
        initials()
      }}</span>
      <div class="profile-head-info">
        <span class="profile-head-name">{{ userName() }}</span>
        <span class="profile-head-email">{{ email() }}</span>
        <span class="profile-head-role">{{ role() }}</span>
      </div>
    </div>

    <div class="profile-list">
      <a
        class="profile-item"
        role="menuitem"
        routerLink="profiles"
        (click)="close()"
      >
        <i class="fi fi-rr-user" aria-hidden="true"></i>
        <span>My Profile</span>
      </a>
      <button
        type="button"
        class="profile-item"
        role="menuitem"
        (click)="onChangePassword()"
      >
        <i class="fi fi-rr-lock" aria-hidden="true"></i>
        <span>Change password</span>
      </button>
      <a
        class="profile-item"
        role="menuitem"
        routerLink="preferences"
        (click)="close()"
      >
        <i class="fi fi-rr-settings-sliders" aria-hidden="true"></i>
        <span>Preferences</span>
      </a>
    </div>

    <div class="profile-divider"></div>

    <div class="profile-list">
      <button
        type="button"
        class="profile-item profile-item-danger"
        role="menuitem"
        (click)="onLogout()"
      >
        <i class="fi fi-rr-sign-out-alt" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</ng-template>
