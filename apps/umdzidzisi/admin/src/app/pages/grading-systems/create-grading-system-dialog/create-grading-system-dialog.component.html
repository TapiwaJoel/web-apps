<div
  class="bg-umdzidzisi-900/50 fixed inset-0 z-40"
  role="button"
  tabindex="0"
  aria-label="Close dialog"
  (click)="onCancel()"
  (keydown.enter)="onCancel()"
></div>

<div
  class="bg-theme-background border-theme-border fixed top-1/2 left-1/2 z-50 max-h-[calc(100vh-2rem)] w-[calc(100%-2rem)] max-w-lg -translate-x-1/2 -translate-y-1/2 overflow-y-auto rounded-2xl border p-8 shadow-xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="create-grading-system-title"
  (keydown.escape)="onCancel()"
>
  <div class="mb-6 flex items-center justify-between">
    <h2
      id="create-grading-system-title"
      class="text-theme-text text-xl font-semibold"
    >
      Create Grading System
    </h2>
    <button
      type="button"
      class="text-theme-text-secondary hover:bg-theme-border/40 hover:text-theme-text grid h-8 w-8 cursor-pointer place-items-center rounded-full disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Close"
      [disabled]="creating()"
      (click)="onCancel()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="grid grid-cols-1 gap-y-5">
    <div>
      <label
        for="grading-system-examination"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Examination <span class="text-error">*</span></label
      >
      <select
        id="grading-system-examination"
        class="border-theme-border bg-theme-background text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().examinationId"
        (ngModelChange)="updateForm('examinationId', $event)"
      >
        <option value="" disabled>Select an examination</option>
        @for (examination of examinations(); track examination._id) {
          <option [value]="examination._id">{{ examination.name }}</option>
        }
      </select>
    </div>
    <div>
      <label
        for="grading-system-name"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Name <span class="text-error">*</span></label
      >
      <input
        id="grading-system-name"
        type="text"
        placeholder="e.g. A*–G"
        class="border-theme-border bg-theme-background text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().name"
        (ngModelChange)="updateForm('name', $event)"
      />
    </div>
    <div>
      <label
        for="grading-system-description"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Description</label
      >
      <textarea
        id="grading-system-description"
        rows="3"
        class="border-theme-border bg-theme-background text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().description"
        (ngModelChange)="updateForm('description', $event)"
      ></textarea>
    </div>
    <p class="text-theme-text-secondary text-xs">
      Add the score bands from the grading system’s detail panel once it’s
      created.
    </p>
  </div>

  <div class="mt-8 flex items-center justify-end gap-3">
    <button
      type="button"
      class="border-theme-border text-theme-text hover:bg-theme-border/20 cursor-pointer rounded-lg border px-4 py-2.5 text-sm font-medium disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="creating()"
      (click)="onCancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="bg-umdzidzisi-600 text-umdzidzisi-50 cursor-pointer rounded-lg px-4 py-2.5 text-sm font-medium hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!isValid() || creating()"
      (click)="onSubmit()"
    >
      {{ creating() ? 'Creating…' : 'Create Grading System' }}
    </button>
  </div>
</div>
