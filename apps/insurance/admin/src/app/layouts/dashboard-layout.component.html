<org-sidebar-layout
  [navigationNodes]="navConfig"
  brandName="Insurance Admin"
  logoUrl="/assets/logos/insurance-logo.svg"
  [collapsible]="true"
>
  <!-- Off-white surround fills the whole content column (covers the shared white
       .main-content) so it reads as one continuous surface with the sidebar,
       instead of two unrelated background tones. -->
  <div class="dashboard-surround flex min-h-full flex-col">
    <div class="dashboard-surround sticky top-0 z-20 px-8 pt-6 pb-6">
      <div class="flex items-center justify-between gap-6">
        <div class="flex flex-col gap-0.5">
          <h1 class="text-theme-text text-2xl font-bold whitespace-nowrap">
            Hello, {{ currentUserFirstName() }}!
          </h1>
          <p class="text-theme-text-secondary text-sm whitespace-nowrap">
            Explore information and activity about your account
          </p>
        </div>
        <org-dashboard-topbar
          [userName]="currentUserName()"
          [userEmail]="currentUserEmail()"
          [userRole]="currentUserRole()"
          [userPhone]="currentUserPhone()"
          (logout)="logout()"
        />
      </div>
    </div>
    <!-- White content panel, curved at its top-left corner and lifted with a
         soft shadow so it reads as raised above the surround. -->
    <div class="dashboard-panel bg-theme-background flex-1 rounded-tl-3xl">
      <router-outlet />
    </div>
  </div>
</org-sidebar-layout>
