<org-sidebar-layout
  [navigationNodes]="navConfig"
  brandName="Insurance Admin"
  logoUrl="/assets/logos/insurance-logo.svg"
  [collapsible]="true"
>
  <div class="flex flex-col">
    <div
      class="dashboard-header-divider bg-theme-background border-theme-border sticky top-0 z-20 border-b px-6 pt-4 pb-4"
    >
      <div class="flex items-center justify-between gap-4">
        <h1 class="text-theme-text text-2xl font-bold whitespace-nowrap">
          Welcome back, {{ currentUserFirstName() }} 👋
        </h1>
        <org-dashboard-topbar
          [userName]="currentUserName()"
          [userEmail]="currentUserEmail()"
          [userRole]="currentUserRole()"
          (logout)="logout()"
        />
      </div>
    </div>
    <div class="flex-1">
      <router-outlet></router-outlet>
    </div>
  </div>
</org-sidebar-layout>
