<button
  type="button"
  class="focus:ring-theme-primary hover:bg-insurance-50 flex cursor-pointer items-center gap-2 rounded-full p-1 transition-colors focus:ring-2 focus:outline-none"
  aria-label="Account menu"
  [attr.aria-expanded]="isOpen()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="toggle()"
>
  <span
    class="bg-insurance-600 grid h-9 w-9 flex-shrink-0 place-items-center rounded-full text-sm font-semibold text-white"
    aria-hidden="true"
    >{{ initials() }}</span
  >
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPositions]="[
    {
      originX: 'end',
      originY: 'bottom',
      overlayX: 'end',
      overlayY: 'top',
      offsetY: 8,
    },
  ]"
  (backdropClick)="close()"
  (overlayOutsideClick)="close()"
  (detach)="close()"
>
  <div
    class="bg-theme-surface border-theme-border w-68 max-w-[calc(100vw-2rem)] overflow-hidden rounded-xl border shadow-md"
    role="menu"
    aria-label="Account menu"
    tabindex="-1"
    (keydown.escape)="close()"
  >
    <div class="border-theme-border flex items-center gap-3 border-b p-4">
      <span
        class="bg-insurance-600 grid h-11 w-11 flex-shrink-0 place-items-center rounded-full text-base font-semibold text-white"
        aria-hidden="true"
        >{{ initials() }}</span
      >
      <div class="flex min-w-0 flex-col gap-0.5">
        <span class="text-theme-text truncate text-sm font-semibold">{{
          userName()
        }}</span>
        @if (userEmail()) {
          <span class="text-theme-text-secondary truncate text-xs">{{
            userEmail()
          }}</span>
        }
        @if (userPhone()) {
          <span class="text-theme-text-secondary truncate text-xs">{{
            userPhone()
          }}</span>
        }
        @if (userRole()) {
          <span
            class="bg-insurance-100 text-insurance-600 mt-0.5 self-start rounded-full px-2 py-0.5 text-[0.68rem] font-semibold"
            >{{ userRole() }}</span
          >
        }
      </div>
    </div>

    <div class="flex flex-col gap-0.5 p-1.5">
      <a
        class="text-theme-text hover:bg-insurance-50 flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm no-underline"
        role="menuitem"
        routerLink="profile"
        (click)="close()"
      >
        <i
          class="fi fi-rr-user text-theme-text-secondary w-4.5 text-center text-sm"
          aria-hidden="true"
        ></i>
        <span>Profile</span>
      </a>
      <a
        class="text-theme-text hover:bg-insurance-50 flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-sm no-underline"
        role="menuitem"
        routerLink="preferences"
        (click)="close()"
      >
        <i
          class="fi fi-rr-settings-sliders text-theme-text-secondary w-4.5 text-center text-sm"
          aria-hidden="true"
        ></i>
        <span>Preferences</span>
      </a>
    </div>

    <div class="border-theme-border border-t"></div>

    <div class="flex flex-col gap-0.5 p-1.5">
      <button
        type="button"
        class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-sm text-red-600 hover:bg-red-50"
        role="menuitem"
        (click)="onLogout()"
      >
        <i
          class="fi fi-rr-sign-out-alt w-4.5 text-center text-sm"
          aria-hidden="true"
        ></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</ng-template>
