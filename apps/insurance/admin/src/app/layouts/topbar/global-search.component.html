<label
  class="border-theme-border bg-theme-surface focus-within:border-theme-primary focus-within:ring-theme-primary flex h-12 max-w-xl flex-1 items-center gap-3 rounded-full border px-5 focus-within:ring-2"
>
  <i
    class="fi fi-rr-search text-theme-text-secondary text-base"
    aria-hidden="true"
  ></i>
  <input
    type="search"
    class="text-theme-text placeholder:text-theme-text-secondary h-full w-full border-none bg-transparent text-base outline-none"
    [placeholder]="placeholder()"
    aria-label="Search"
    [value]="term()"
    (input)="onInput($event)"
  />
</label>
