<label
  class="border-theme-border bg-theme-surface focus-within:border-theme-primary focus-within:ring-theme-primary flex h-10 max-w-md flex-1 items-center gap-2 rounded-full border px-4 focus-within:ring-2"
>
  <i
    class="fi fi-rr-search text-theme-text-secondary text-sm"
    aria-hidden="true"
  ></i>
  <input
    type="search"
    class="text-theme-text placeholder:text-theme-text-secondary h-full w-full border-none bg-transparent text-sm outline-none"
    placeholder="Search..."
    aria-label="Search"
    [value]="query()"
    (input)="onInput($event)"
  />
</label>
