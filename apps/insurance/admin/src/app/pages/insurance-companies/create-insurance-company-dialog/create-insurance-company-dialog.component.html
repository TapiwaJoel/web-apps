<div
  class="fixed inset-0 z-40 bg-black/45"
  role="button"
  tabindex="0"
  aria-label="Close dialog"
  (click)="onCancel()"
  (keydown.enter)="onCancel()"
></div>

<div
  class="bg-theme-background border-theme-border fixed top-1/2 left-1/2 z-50 w-full max-w-lg -translate-x-1/2 -translate-y-1/2 rounded-2xl border p-8 shadow-xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="create-insurance-company-title"
  (keydown.escape)="onCancel()"
>
  <div class="mb-6 flex items-center justify-between">
    <h2
      id="create-insurance-company-title"
      class="text-theme-text text-xl font-semibold"
    >
      Create Insurance Company
    </h2>
    <button
      type="button"
      class="text-theme-text-secondary hover:bg-theme-border/40 hover:text-theme-text grid h-8 w-8 cursor-pointer place-items-center rounded-full disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Close"
      [disabled]="creating()"
      (click)="onCancel()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="grid grid-cols-1 gap-y-5">
    <div>
      <label
        for="insurance-company-user"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Linked User</label
      >
      <select
        id="insurance-company-user"
        class="border-theme-border text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().systemUserId"
        (ngModelChange)="updateForm('systemUserId', $event)"
      >
        <option value="" disabled>Select a system user</option>
        @for (user of users(); track user._id) {
          <option [value]="user._id">{{ user.name }}</option>
        }
      </select>
    </div>
    <div>
      <label
        for="insurance-company-commission-rate"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Commission Rate (%)</label
      >
      <input
        id="insurance-company-commission-rate"
        type="number"
        min="0"
        max="100"
        step="0.01"
        class="border-theme-border text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().commissionRate"
        (ngModelChange)="onRateChange('commissionRate', $event)"
      />
    </div>
    <div>
      <label
        for="insurance-company-marketing-rate"
        class="text-theme-text mb-1.5 block text-sm font-medium"
        >Marketing Rate (%)</label
      >
      <input
        id="insurance-company-marketing-rate"
        type="number"
        min="0"
        max="100"
        step="0.01"
        class="border-theme-border text-theme-text w-full rounded-lg border px-3.5 py-2.5 text-sm"
        [ngModel]="form().marketingRate"
        (ngModelChange)="onRateChange('marketingRate', $event)"
      />
      @if (exceedsCombinedLimit()) {
        <p class="text-error mt-1.5 text-xs">
          Commission + Marketing cannot exceed 100%
        </p>
      }
    </div>
  </div>

  <div class="mt-8 flex items-center justify-end gap-3">
    <button
      type="button"
      class="border-theme-border text-theme-text hover:bg-theme-border/20 cursor-pointer rounded-lg border px-4 py-2.5 text-sm font-medium disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="creating()"
      (click)="onCancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="bg-insurance-600 cursor-pointer rounded-lg px-4 py-2.5 text-sm font-medium text-white hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!isValid() || creating()"
      (click)="onSubmit()"
    >
      {{ creating() ? 'Creating…' : 'Create Insurance Company' }}
    </button>
  </div>
</div>
