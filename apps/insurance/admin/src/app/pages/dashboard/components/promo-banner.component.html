<div
  class="bg-insurance-50 border-insurance-100 flex h-full flex-col justify-between gap-4 rounded-lg border p-6"
>
  <div class="flex items-start justify-between gap-3">
    <h3 class="text-theme-text text-base font-bold">{{ title() }}</h3>
    <div
      class="relative flex h-10 w-12 shrink-0 items-center justify-center"
      aria-hidden="true"
    >
      <span class="absolute -top-0.5 left-1/2 -translate-x-1/2 text-xl"
        >☂️</span
      >
      <span class="relative z-10 translate-y-1.5 text-3xl">🚗</span>
    </div>
  </div>
  <p class="text-theme-text-secondary flex-1 text-sm">
    {{ description() }}
  </p>
  <button
    type="button"
    class="bg-insurance-600 w-full rounded-md px-4 py-2 text-sm font-medium text-white"
  >
    {{ ctaLabel() }}
  </button>
</div>
