<div
  class="bg-insurance-50 border-insurance-100 flex flex-col items-center justify-between gap-6 rounded-lg border p-6 sm:flex-row"
>
  <div class="flex flex-col gap-2">
    <h3 class="text-theme-text text-lg font-bold">{{ title() }}</h3>
    <p class="text-theme-text-secondary max-w-xl text-sm">
      {{ description() }}
    </p>
    <button
      type="button"
      class="bg-insurance-600 mt-2 w-fit rounded-md px-4 py-2 text-sm font-medium text-white"
    >
      {{ ctaLabel() }}
    </button>
  </div>
  <div
    class="relative flex h-24 w-32 shrink-0 items-center justify-center"
    aria-hidden="true"
  >
    <span class="absolute -top-1 left-1/2 -translate-x-1/2 text-4xl">☂️</span>
    <span class="relative z-10 translate-y-3 text-6xl">🚗</span>
  </div>
</div>
