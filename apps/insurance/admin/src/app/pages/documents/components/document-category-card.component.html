<div
  class="border-theme-border bg-theme-surface flex flex-col gap-4 rounded-lg border p-6"
>
  <div class="flex items-center justify-between">
    <span class="text-2xl">{{ icon() }}</span>
    <span class="text-theme-text-secondary text-sm" aria-hidden="true">↗</span>
  </div>
  <div>
    <h3 class="text-theme-text text-base font-semibold">{{ label() }}</h3>
    <p class="text-theme-text-secondary text-sm tabular-nums">
      {{ fileCount() }} files · {{ sizeLabel() }}
    </p>
  </div>
</div>
