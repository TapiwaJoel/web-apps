<div class="bg-insurance-600 flex flex-col gap-6 rounded-lg p-6 text-white">
  <div class="flex items-center justify-between">
    <h3 class="text-base font-semibold">Storage Usage</h3>
  </div>
  <div class="flex items-center gap-6">
    <!-- eslint-disable-next-line @angular-eslint/template/no-inline-styles -->
    <div
      class="relative flex h-32 w-32 shrink-0 items-center justify-center rounded-full"
      [style.background]="donutGradient()"
    >
      <div
        class="bg-insurance-600 flex h-24 w-24 flex-col items-center justify-center rounded-full"
      >
        <span class="text-2xl font-bold tabular-nums">{{ usedPct() }}%</span>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <p class="text-lg font-semibold tabular-nums">
        {{ usedLabel() }}
        <span class="text-insurance-200 text-sm font-normal"
          >out of {{ totalLabel() }}</span
        >
      </p>
      <ul class="flex flex-col gap-1.5">
        @for (slice of slices(); track slice.label) {
          <li class="flex items-center gap-2 text-sm">
            <span class="h-1.5 w-1.5 rounded-full bg-white"></span>
            <span class="tabular-nums"
              >{{ slice.pct }}% · {{ slice.sizeLabel }}</span
            >
            <span class="text-insurance-200">{{ slice.label }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
