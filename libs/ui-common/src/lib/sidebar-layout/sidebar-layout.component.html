<div class="sidebar-layout">
  <!-- Sidebar shell: a T — a full-width topbar over a rail + tree body -->
  <div
    class="sidebar-shell fixed top-0 z-50 flex h-screen flex-col transition-all duration-300 ease-in-out md:sticky md:z-auto"
    [class.sidebar-collapsed]="isCollapsed()"
  >
    <!-- Collapse/expand toggle: a chevron chip on the sidebar's right edge that
         reveals on hover (Linear/Notion style). Stays visible when collapsed. -->
    <button
      *ngIf="collapsible"
      type="button"
      class="sidebar-edge-toggle hidden md:flex"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!isCollapsed()"
    >
      <svg
        class="h-3.5 w-3.5"
        [class.rotate-180]="isCollapsed()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>

    <!-- Topbar (spans rail + tree) -->
    <div
      class="sidebar-topbar flex items-center p-4"
    >
      <!-- Logo sits over the rail column -->
      <div
        class="sidebar-logo flex h-10 w-10 flex-shrink-0 items-center justify-center overflow-hidden rounded-lg"
      >
        <img
          *ngIf="logoUrl; else logoPlaceholder"
          [src]="logoUrl"
          [alt]="brandName || 'Logo'"
          class="h-10 w-10 object-contain"
        />
        <ng-template #logoPlaceholder>
          <span
            class="text-theme-text flex h-full w-full items-center justify-center rounded-lg text-lg font-semibold"
            [style.background-color]="'color-mix(in srgb, var(--theme-primary-color) 10%, transparent)'"
          >
            {{ brandName?.charAt(0) || 'M' }}
          </span>
        </ng-template>
      </div>

      <!-- Brand name sits over the tree column -->
      <div
        *ngIf="!isCollapsed()"
        class="sidebar-brand-name ml-3 flex min-w-0 flex-1 items-center"
      >
        <span class="text-theme-text truncate text-sm font-semibold">
          {{ brandName || 'Dashboard' }}
        </span>
      </div>

    </div>

    <!-- Body: rail + tree columns -->
    <div class="sidebar-body flex min-h-0 flex-1">
      <!-- Icon Rail (optional; only when railNodes provided) -->
      @if (hasRail) {
        <nav
          class="sidebar-rail hidden flex-shrink-0 flex-col items-center md:flex"
          aria-label="Workspace switcher"
        >
          @for (item of railNodes; track trackRail($index, item)) {
            <a
              class="rail-btn flex h-10 w-10 items-center justify-center rounded-full transition-colors"
              [routerLink]="item.route || null"
              routerLinkActive="rail-btn-active"
              #rlaRail="routerLinkActive"
              (click)="selectRail(item)"
              cdkOverlayOrigin
              #railOrigin="cdkOverlayOrigin"
              (mouseenter)="openFlyout(item)"
              (mouseleave)="scheduleClose()"
              (focus)="openFlyout(item)"
              (blur)="scheduleClose()"
              (keydown.escape)="closeFlyout()"
              [attr.aria-label]="item.label"
              [attr.aria-current]="rlaRail.isActive ? 'page' : null"
            >
              <i [class]="item.icon" class="rail-icon"></i>
            </a>

            <ng-template
              cdkConnectedOverlay
              [cdkConnectedOverlayOrigin]="railOrigin"
              [cdkConnectedOverlayOpen]="flyoutOpenFor(item)"
              [cdkConnectedOverlayPositions]="flyoutPositions"
            >
              <mushaviri-rail-flyout
                [node]="item"
                (navigate)="closeFlyout()"
                (mouseenter)="cancelClose()"
                (mouseleave)="scheduleClose()"
              ></mushaviri-rail-flyout>
            </ng-template>
          }

          <!-- Pinned bottom group (e.g. logout) -->
          @if (railFooterNodes && railFooterNodes.length) {
            <div class="rail-spacer"></div>
            @for (item of railFooterNodes; track trackRail($index, item)) {
              <a
                class="rail-btn flex h-10 w-10 items-center justify-center rounded-full transition-colors"
                [routerLink]="item.route || null"
                routerLinkActive="rail-btn-active"
                #rlaRailFooter="routerLinkActive"
                (click)="selectRail(item)"
                cdkOverlayOrigin
                #railFooterOrigin="cdkOverlayOrigin"
                (mouseenter)="openFlyout(item)"
                (mouseleave)="scheduleClose()"
                (focus)="openFlyout(item)"
                (blur)="scheduleClose()"
                (keydown.escape)="closeFlyout()"
                [attr.aria-label]="item.label"
                [attr.aria-current]="rlaRailFooter.isActive ? 'page' : null"
              >
                <i [class]="item.icon" class="rail-icon"></i>
              </a>

              <ng-template
                cdkConnectedOverlay
                [cdkConnectedOverlayOrigin]="railFooterOrigin"
                [cdkConnectedOverlayOpen]="flyoutOpenFor(item)"
                [cdkConnectedOverlayPositions]="flyoutPositions"
              >
                <mushaviri-rail-flyout
                  [node]="item"
                  (navigate)="closeFlyout()"
                  (mouseenter)="cancelClose()"
                  (mouseleave)="scheduleClose()"
                ></mushaviri-rail-flyout>
              </ng-template>
            }
          } @else {
            <div class="rail-spacer"></div>
          }
        </nav>
      }

      <!-- Tree panel -->
      <aside
        class="sidebar flex min-w-0 flex-1 flex-col"
        style="background-color: var(--theme-sidebar-bg, #f7f7f9)"
        [style.width]="currentSidebarWidth"
      >
        <!-- Navigation (removed from the DOM when collapsed to an icon rail) -->
        <div
          *ngIf="!railOnlyCollapsed"
          class="sidebar-content flex-1 overflow-hidden"
        >
          <mushaviri-tree-navigation
            [nodes]="navigationNodes"
            [config]="navigationConfig || {}"
          ></mushaviri-tree-navigation>
        </div>

        <!-- Footer (Toggle Button) — only for the rail-less layout. When a rail
             exists it owns the toggle (see the rail footer above), so this is
             suppressed to avoid a duplicate control. -->
        <div
          *ngIf="collapsible && !hasRail"
          class="sidebar-footer border-theme-border hidden items-center justify-center border-t p-4 md:flex"
        >
          <button
            type="button"
            class="sidebar-toggle-btn text-theme-text-secondary hover:text-theme-primary flex h-8 w-8 items-center justify-center rounded-lg transition-colors"
            (click)="toggleSidebar()"
            [attr.aria-label]="
              isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'
            "
            [attr.aria-expanded]="!isCollapsed()"
          >
            <svg
              class="h-5 w-5 transition-transform duration-300"
              [class.rotate-180]="isCollapsed()"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
              />
            </svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="main-content min-w-0 flex-1">
    <!-- Content Projection -->
    <div class="content-wrapper">
      <ng-content></ng-content>
    </div>
  </main>
</div>
