<nav class="tree-navigation" role="navigation" aria-label="Main navigation">
  <div class="tree-navigation-content">
    @for (node of nodes; track trackByFn($index, node)) {
      <org-tree-node
        [node]="node"
        [level]="0"
        [expanded]="node.expanded ?? config.defaultExpanded ?? false"
        [showIcons]="config.showIcons ?? true"
        [showBadges]="config.showBadges ?? true"
        [collapsible]="config.collapsible ?? true"
      ></org-tree-node>
    }
  </div>
</nav>
